<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <defs>
    <linearGradient id="bagGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#22c55e"/>
      <stop offset="100%" style="stop-color:#16a34a"/>
    </linearGradient>
  </defs>
  
  <!-- Shopping bag body -->
  <path d="M20 35 L15 90 Q15 95 20 95 L80 95 Q85 95 85 90 L80 35 Z" 
        fill="url(#bagGradient)" 
        stroke="#15803d" 
        stroke-width="2"/>
  
  <!-- Bag handles -->
  <path d="M35 35 Q35 15 50 15 Q65 15 65 35" 
        fill="none" 
        stroke="#15803d" 
        stroke-width="5" 
        stroke-linecap="round"/>
  
  <!-- Checkmark -->
  <path d="M35 60 L45 72 L68 48" 
        fill="none" 
        stroke="white" 
        stroke-width="8" 
        stroke-linecap="round" 
        stroke-linejoin="round"/>
  
  <!-- Shine effect -->
  <ellipse cx="30" cy="50" rx="5" ry="10" fill="rgba(255,255,255,0.3)"/>
</svg>
